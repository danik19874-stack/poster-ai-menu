<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0%" stop-color="#3a2a1c" />
      <stop offset="45%" stop-color="#1f1712" />
      <stop offset="100%" stop-color="#100c09" />
    </radialGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8c3a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ff8c3a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="headGrad" x1="208" y1="168" x2="392" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#332a22" />
      <stop offset="100%" stop-color="#0d0a08" />
    </linearGradient>

    <linearGradient id="domeGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cabe9f" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a" />
      <stop offset="100%" stop-color="#ffb056" />
    </linearGradient>

    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114" />
    </clipPath>

    <filter id="blurSm"><feGaussianBlur stdDeviation="8" /></filter>
    <filter id="blurLg"><feGaussianBlur stdDeviation="22" /></filter>

    <filter id="mascotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />

    <g filter="url(#blurSm)" opacity="0.5">
      <circle cx="78" cy="96" r="26" fill="#ffb056" />
      <circle cx="438" cy="74" r="18" fill="#ff7a1a" />
      <circle cx="452" cy="300" r="30" fill="#ffb056" />
      <circle cx="52" cy="360" r="22" fill="#ff7a1a" />
      <circle cx="250" cy="46" r="14" fill="#ffb056" />
    </g>

    <ellipse cx="300" cy="245" rx="165" ry="150" fill="url(#halo)" filter="url(#blurLg)" />

    <ellipse cx="298" cy="368" rx="120" ry="18" fill="#000000" opacity="0.35" filter="url(#blurSm)" />

    <g filter="url(#mascotShadow)">
      <circle cx="300" cy="260" r="92" fill="url(#headGrad)" />
      <path d="M 358,318 Q 384,320 380,344 Q 358,340 350,320 Z" fill="url(#headGrad)" />

      <g transform="rotate(-6 300 190)">
        <path d="M 188,190 A 112,95 0 0 1 412,190 Z" fill="url(#domeGrad)" />
        <ellipse cx="300" cy="190" rx="118" ry="16" fill="#b9ac8c" />
        <ellipse cx="300" cy="194" rx="108" ry="10" fill="#1a130c" opacity="0.28" filter="url(#blurSm)" />
        <circle cx="300" cy="96" r="13" fill="url(#domeGrad)" />
      </g>

      <ellipse cx="262" cy="230" rx="26" ry="15" fill="#4a4038" opacity="0.4" />
      <circle cx="270" cy="270" r="13" fill="#f8f1e4" />
      <circle cx="330" cy="270" r="13" fill="#f8f1e4" />
    </g>

    <g>
      <rect x="48" y="204" width="72" height="15" rx="7.5" fill="url(#orangeGrad)" opacity="0.55" />
      <rect x="66" y="230" width="58" height="15" rx="7.5" fill="url(#orangeGrad)" opacity="0.75" />
      <rect x="82" y="256" width="42" height="15" rx="7.5" fill="url(#orangeGrad)" />
    </g>

    <text x="256" y="452" text-anchor="middle" font-family="Geist, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="-1" fill="#f8f1e4">НеЖди</text>
  </g>
</svg>
